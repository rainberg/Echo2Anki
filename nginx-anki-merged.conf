server {
    listen 80;
    listen [::]:80;
    server_name anki.3mudi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anki.3mudi.com;

    ssl_certificate /etc/letsencrypt/live/anki.3mudi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anki.3mudi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500m;
    client_body_timeout 86400;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Anki Sync Server
    location /sync/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /msync/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Swipe Learning App - static assets
    location /_expo/ {
        root /opt/anki-app/swipe;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Swipe Learning App - main page
    location /swipe/ {
        alias /opt/anki-app/swipe/;
        index index.html;
    }

    location = /swipe {
        return 301 /swipe/;
    }

    # Audio media
    location /subtitle-media/ {
        alias /var/lib/anki-streamlit-subtitle/tasks/;
        autoindex off;
        types { audio/mpeg mp3; audio/mp4 m4a; audio/ogg ogg; audio/wav wav; }
        add_header Cache-Control "private, max-age=3600";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location /v2-media/ {
        alias /var/lib/anki-v2/tasks/;
        autoindex off;
        types { audio/mpeg mp3; audio/mp4 m4a; audio/ogg ogg; audio/wav wav; }
        add_header Cache-Control "private, max-age=3600";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location /media/ {
        alias /var/lib/anki-v2/tasks/;
        autoindex off;
        types { audio/mpeg mp3; audio/mp4 m4a; audio/ogg ogg; audio/wav wav; }
        add_header Cache-Control "private, max-age=3600";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Legacy Streamlit
    location /legacy/ {
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /legacy {
        return 302 /legacy/;
    }

    # Frontend assets
    location /assets/ {
        root /opt/anki-app/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Frontend (catch-all)
    location / {
        root /opt/anki-app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
