server {
    listen 80;
    server_name anki.3mudi.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name anki.3mudi.com;

    ssl_certificate /etc/letsencrypt/live/anki.3mudi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anki.3mudi.com/privkey.pem;

    # Vue Frontend
    location / {
        root /opt/anki-app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Swipe Learning App (React Native Web)
    location /swipe {
        alias /opt/anki-app/swipe;
        index index.html;
        try_files $uri $uri/ /swipe/index.html;
    }

    # Swipe static assets with long cache
    location /swipe/_expo/ {
        alias /opt/anki-app/swipe/_expo/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Segment audio clips
    location /api/segments/ {
        proxy_pass http://127.0.0.1:8000/api/segments/;
        proxy_set_header Host $host;
    }

    # WebSocket support (if needed)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
