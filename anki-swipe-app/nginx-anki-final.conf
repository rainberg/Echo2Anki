server {
    listen 80;
    server_name anki.3mudi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name anki.3mudi.com;

    ssl_certificate /etc/letsencrypt/live/anki.3mudi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anki.3mudi.com/privkey.pem;

    # Swipe Learning App - static assets (must come before /api/)
    location /_expo/ {
        root /opt/anki-app/swipe;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Swipe Learning App - main page
    location /swipe/ {
        alias /opt/anki-app/swipe/;
        index index.html;
    }

    location = /swipe {
        return 301 /swipe/;
    }

    # Swipe favicon
    location = /favicon.ico {
        root /opt/anki-app/swipe;
    }

    # Vue Frontend
    location / {
        root /opt/anki-app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
